<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precedência de Permissões e Execução Autônoma no Google Antigravity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame {
      max-width: 1100px;
      width: 100%;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="antigravity-permissoes-title antigravity-permissoes-desc">
      <title id="antigravity-permissoes-title">Precedência de Permissões e Execução Autônoma no Google Antigravity</title>
      <desc id="antigravity-permissoes-desc">Diagrama de fluxo do motor Agent 2.0 avaliando regras nas listas DENY, ASK e ALLOW com 6 wildcards universais.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <!-- Cabeçalho Editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">GOOGLE ANTIGRAVITY · ARQUITETURA AGENT 2.0</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">Precedência de Permissões e Execução Autônoma</text>
      <line x1="40" y1="92" x2="1060" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- CONECTORES PRIMEIRO (Z-index correto) -->
      <!-- Entrada -> Motor -->
      <line x1="550" y1="180" x2="550" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Motor -> Decisão -->
      <line x1="550" y1="284" x2="550" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Decisão -> DENY (Esquerda) -->
      <line x1="440" y1="356" x2="290" y2="356" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Decisão -> ASK (Baixo) -->
      <line x1="550" y1="396" x2="550" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Decisão -> ALLOW (Direita - Focal) -->
      <line x1="660" y1="356" x2="760" y2="356" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

      <!-- RÓTULOS DE CONECTORES COM MÁSCARA OPACA -->
      <rect x="502" y="194" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUISIÇÃO</text>

      <rect x="506" y="294" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AVALIAÇÃO</text>

      <rect x="325" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="365" y="349" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENY (P1)</text>

      <rect x="510" y="420" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK (P2)</text>

      <rect x="670" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="349" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOW (P3)</text>

      <!-- NÓS (CAIXAS E TEXTOS) -->
      <!-- Nó 1: Entrada -->
      <rect x="420" y="116" width="260" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="428" y="124" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="452" y="133" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="550" y="146" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity IDE &amp; CLI agy</text>
      <text x="550" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ambiente de desenvolvimento local</text>

      <!-- Nó 2: Motor Agent 2.0 -->
      <rect x="420" y="220" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="428" y="228" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="450" y="237" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOTOR</text>
      <text x="550" y="250" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor Unificado Agent 2.0</text>
      <text x="550" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">avaliador de políticas de segurança</text>

      <!-- Nó de Decisão: Losango -->
      <polygon points="550,316 660,356 550,396 440,356" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="550" y="352" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Em qual lista</text>
      <text x="550" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a regra está?</text>

      <!-- Nó 3: DENY -->
      <rect x="50" y="324" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="58" y="332" width="38" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="77" y="341" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENY</text>
      <text x="170" y="354" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bloqueio Imediato</text>
      <text x="170" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">execução abortada sumariamente</text>

      <!-- Nó 4: ASK -->
      <rect x="420" y="456" width="260" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="428" y="464" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="445" y="473" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>
      <text x="550" y="486" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prompt Interativo</text>
      <text x="550" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aguardando confirmação manual</text>

      <!-- Nó 5: ALLOW (FOCAL CORAL) -->
      <rect x="760" y="284" width="290" height="144" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="768" y="292" width="46" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
      <text x="791" y="301" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOW</text>
      <text x="905" y="316" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execução Imediata</text>
      <text x="905" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">modo autônomo sem interrupções</text>
      <line x1="780" y1="346" x2="1030" y2="346" stroke="rgba(235,108,54,0.2)" stroke-width="0.8"/>
      <text x="905" y="368" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read_file(/)  ·  write_file(/)</text>
      <text x="905" y="388" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">command(*)  ·  read_url(*)</text>
      <text x="905" y="408" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">execute_url(*)  ·  mcp(*)</text>

      <!-- LEGENDA INFERIOR -->
      <line x1="40" y1="576" x2="1060" y2="576" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="602" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      
      <!-- Itens da legenda -->
      <rect x="130" y="594" width="16" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="154" y="602" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Interface / Entrada</text>

      <rect x="290" y="594" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="314" y="602" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Motor de Avaliação</text>

      <polygon points="450,594 458,599 450,604 442,599" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="466" y="602" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decisão de Precedência</text>

      <rect x="620" y="594" width="16" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="644" y="602" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Aguardando Confirmação</text>

      <rect x="810" y="594" width="16" height="10" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1"/>
      <text x="834" y="602" fill="#eb6c36" font-size="9" font-family="'Geist', sans-serif" font-weight="600">Execução Autônoma (Focal)</text>
    
    </svg>
  </div>
</body>
</html>
