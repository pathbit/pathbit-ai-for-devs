<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrigir cedo é barato; tarde, é sprint: custo por momento de descoberta</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="custo-erro-title custo-erro-desc">
      <title id="custo-erro-title">Corrigir cedo é barato; tarde, é sprint: custo por momento de descoberta</title>
      <desc id="custo-erro-desc">Gráfico de colunas crescentes mostrando o custo de corrigir um erro conforme o momento em que ele é descoberto: na spec, no plano, na revisão do código e em produção, com destaque sobre a primeira coluna.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SDD · SPEC DRIVEN DEVELOPMENT · ARTIGO 0005</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">Corrigir cedo é barato; tarde, é sprint</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== GRÁFICO DE COLUNAS ===== -->
      <!-- Coluna 1: na spec (mínima) -->
      <rect x="120" y="440" width="120" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <!-- Coluna 2: no plano -->
      <rect x="360" y="350" width="120" height="150" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <!-- Coluna 3: na revisão do código -->
      <rect x="600" y="240" width="120" height="260" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <!-- Coluna 4: em produção (máxima, em acento) -->
      <rect x="840" y="100" width="120" height="400" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.4"/>

      <!-- Marcador de destaque sobre a primeira coluna -->
      <rect x="108" y="430" width="144" height="68" rx="3" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="180" y="422" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">SDD decide aqui</text>

      <!-- Eixo x -->
      <line x1="80" y1="500" x2="1000" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <polygon points="1000 500, 992 496, 992 504" fill="#4f5d75"/>

      <text x="180" y="528" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">na spec</text>
      <text x="420" y="528" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no plano</text>
      <text x="660" y="528" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">na revisão do código</text>
      <text x="900" y="528" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">em produção</text>

      <text x="540" y="560" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">quando o erro é descoberto</text>

      <!-- Legenda -->
      <text x="600" y="600" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Mudar uma frase da spec custa <tspan fill="#eb6c36" font-weight="600">segundos</tspan>. A mesma decisão em produção custa uma <tspan fill="#eb6c36" font-weight="600">sprint</tspan>.</text>
      <text x="40" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0005</text>
    </svg>
  </div>
</body>
</html>
