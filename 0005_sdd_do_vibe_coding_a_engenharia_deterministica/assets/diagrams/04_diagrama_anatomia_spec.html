<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomia de uma especificação: as seis peças</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anatomia-spec-title anatomia-spec-desc">
      <title id="anatomia-spec-title">Anatomia de uma especificação: as seis peças</title>
      <desc id="anatomia-spec-desc">Grade de seis blocos numerados com as partes de uma especificação: objetivo, requisitos funcionais, requisitos não-funcionais, critérios de aceite, escopo e restrições técnicas, com destaque para os critérios de aceite.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SDD · SPEC DRIVEN DEVELOPMENT · ARTIGO 0005</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">Anatomia de uma especificação</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== GRADE 3x2 ===== -->
      <!-- 1 · Objetivo -->
      <rect x="40" y="140" width="360" height="150" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="60" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">01</text>
      <text x="60" y="206" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="500">Objetivo</text>
      <text x="60" y="228" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">o "por quê" em duas linhas</text>

      <!-- 2 · Requisitos funcionais -->
      <rect x="420" y="140" width="360" height="150" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="440" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">02</text>
      <text x="440" y="206" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="500">Requisitos funcionais</text>
      <text x="440" y="228" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">o que o sistema faz</text>

      <!-- 3 · Requisitos não-funcionais -->
      <rect x="800" y="140" width="360" height="150" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="820" y="178" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">03</text>
      <text x="820" y="206" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="500">Requisitos não-funcionais</text>
      <text x="820" y="228" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">como o sistema se comporta</text>

      <!-- 4 · Critérios de aceite (peça central, em acento) -->
      <rect x="40" y="320" width="360" height="150" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="60" y="358" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace">04</text>
      <text x="60" y="386" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Critérios de aceite</text>
      <text x="60" y="408" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">afirmação testável com sim ou não</text>

      <!-- 5 · Escopo / Fora de escopo -->
      <rect x="420" y="320" width="360" height="150" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="440" y="358" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">05</text>
      <text x="440" y="386" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="500">Escopo / Fora de escopo</text>
      <text x="440" y="408" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">as duas listas</text>

      <!-- 6 · Restrições técnicas -->
      <rect x="800" y="320" width="360" height="150" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="820" y="358" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">06</text>
      <text x="820" y="386" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="500">Restrições técnicas</text>
      <text x="820" y="408" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">o "como" que já foi decidido</text>

      <!-- Rodapé -->
      <line x1="40" y1="520" x2="1160" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="548" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">A peça central é o critério de aceite: é ele que transforma a spec em algo testável.</text>
      <text x="40" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0005</text>
    </svg>
  </div>
</body>
</html>
