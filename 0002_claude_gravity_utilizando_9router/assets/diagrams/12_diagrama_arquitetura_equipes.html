<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balanceamento de Carga e Escalar Claude Code em Equipes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame {
      max-width: 1200px;
      width: 100%;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">

      <line x1="260" y1="296" x2="420" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="150" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude code cli</text>

      <rect x="40" y="260" width="220" height="72" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1"/>

      <line x1="436" y1="230" x2="744" y2="230" stroke="rgba(235,108,54,0.2)" stroke-width="0.8"/>

      <text x="590" y="258" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Rotação Dinâmica de Credenciais</text>
      <text x="590" y="284" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Isolamento Estrito de Sessões por Dev</text>
      <text x="590" y="310" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Blindagem contra Rate Limit (HTTP 429)</text>
      <text x="590" y="336" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Compressão RTK de Tokens (-30%)</text>
      <text x="590" y="362" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Healthcheck e Failover Automático</text>
      <text x="590" y="394" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">docker swarm · k8s · standalone</text>

      <text x="1030" y="168" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conta Google 1 (AI Pro)</text>
      <text x="1030" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cota individual dedicada</text>

      <!-- Conta 2 -->
      <rect x="900" y="260" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="908" y="268" width="38" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>

      <text x="1030" y="288" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conta Google 2 (AI Pro)</text>
      <text x="1030" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cota individual dedicada</text>

      <rect x="360" y="594" width="16" height="10" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.2"/>

      <rect x="560" y="594" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="584" y="602" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Conta Upstream (AI Pro)</text>

      <line x1="770" y1="599" x2="794" y2="599" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    </svg>
