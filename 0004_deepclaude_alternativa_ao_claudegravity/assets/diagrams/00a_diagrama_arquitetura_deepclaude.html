<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura DeepClaude: Claude Code Direto na DeepSeek e no OrcaRouter</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deepclaude-arq-title deepclaude-arq-desc">
      <title id="deepclaude-arq-title">Arquitetura DeepClaude: Claude Code direto na DeepSeek e no OrcaRouter</title>
      <desc id="deepclaude-arq-desc">Diagrama comparando o ClaudeGravity, que exige um gateway 9Router em container Docker, com o DeepClaude, em que o Claude Code CLI fala diretamente com a DeepSeek Platform e com o OrcaRouter porque ambos expõem a Anthropic Messages API.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ARQUITETURA DEEPCLAUDE · SEM GATEWAY LOCAL</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">O harness da Anthropic falando direto com a DeepSeek</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== FAIXA SUPERIOR: ClaudeGravity (artigo 0002) ===== -->
      <text x="40" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARTIGO 0002 · CLAUDEGRAVITY</text>

      <rect x="40" y="148" width="150" height="62" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="115" y="174" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">Claude Code CLI</text>
      <text x="115" y="192" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">harness agêntico</text>

      <line x1="190" y1="179" x2="248" y2="179" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="250" y="142" width="200" height="74" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="350" y="168" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">9Router (Docker)</text>
      <text x="350" y="186" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">traduz o protocolo</text>
      <text x="350" y="203" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">container obrigatório</text>

      <line x1="450" y1="179" x2="508" y2="179" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="510" y="148" width="180" height="62" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="600" y="174" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">Google Antigravity</text>
      <text x="600" y="192" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">modelos Gemini</text>

      <text x="720" y="172" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Exige assinatura Google AI Pro</text>
      <text x="720" y="192" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">e um container de pé na porta 20128.</text>

      <line x1="40" y1="248" x2="1160" y2="248" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- ===== FAIXA INFERIOR: DeepClaude (artigo 0004) ===== -->
      <text x="40" y="286" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARTIGO 0004 · DEEPCLAUDE</text>

      <!-- Dev -->
      <circle cx="78" cy="400" r="18" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="78" y="405" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">D</text>
      <text x="78" y="440" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">dev</text>

      <line x1="100" y1="400" x2="146" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Claude Code -->
      <rect x="148" y="360" width="190" height="80" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
      <text x="243" y="388" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Claude Code CLI</text>
      <text x="243" y="407" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">--settings</text>
      <text x="243" y="424" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">.claude/settings.local.json</text>

      <!-- Sem gateway -->
      <rect x="372" y="366" width="176" height="68" rx="3" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="460" y="392" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">sem gateway local</text>
      <text x="460" y="411" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">nenhum container</text>
      <line x1="393" y1="425" x2="527" y2="377" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <line x1="338" y1="400" x2="370" y2="400" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="550" y1="400" x2="586" y2="400" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- Bifurcação -->
      <path d="M 588,400 H 618 Q 626,400 626,392 V 340 Q 626,332 634,332 H 664" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <path d="M 588,400 H 618 Q 626,400 626,408 V 462 Q 626,470 634,470 H 664" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Rota 1: DeepSeek Platform -->
      <rect x="666" y="298" width="252" height="70" rx="3" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.3"/>
      <text x="686" y="324" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500">DeepSeek Platform</text>
      <text x="686" y="343" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">api.deepseek.com/anthropic</text>
      <text x="686" y="359" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">pago por uso</text>

      <rect x="938" y="298" width="222" height="70" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="958" y="322" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">deepseek-v4-pro</text>
      <text x="958" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">deepseek-flash</text>
      <text x="958" y="358" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">o catálogo tem só estes dois</text>
      <line x1="918" y1="333" x2="936" y2="333" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Rota 2: OrcaRouter -->
      <rect x="666" y="436" width="252" height="70" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.3"/>
      <text x="686" y="462" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500">OrcaRouter</text>
      <text x="686" y="481" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">api.orcarouter.ai</text>
      <text x="686" y="497" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace">tier gratuito</text>

      <rect x="938" y="436" width="222" height="70" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="958" y="462" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">deepseek/</text>
      <text x="958" y="478" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">deepseek-v4-flash-free</text>
      <text x="958" y="497" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">1M de contexto · $0.00</text>
      <line x1="918" y1="471" x2="936" y2="471" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Rodapé explicativo -->
      <line x1="40" y1="552" x2="1160" y2="552" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="580" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="500">Por que não há gateway nesta arquitetura</text>
      <text x="40" y="602" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Os dois provedores já expõem a Anthropic Messages API. O Claude Code concatena <tspan font-family="'Geist Mono', monospace" font-size="10">/v1/messages</tspan> à URL base e a requisição sai no</text>
      <text x="40" y="622" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">formato nativo — não há protocolo para traduzir, então não há o que um container faria. A URL base vai sem o sufixo <tspan font-family="'Geist Mono', monospace" font-size="10">/v1</tspan>.</text>
      <text x="40" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0004</text>
    </svg>
  </div>
</body>
</html>
