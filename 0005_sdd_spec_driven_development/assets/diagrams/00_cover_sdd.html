<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDD — Spec Driven Development</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #2d3142;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">SDD — Spec Driven Development</title>
  <desc id="d">Capa do artigo 0005: o fluxo spec, plano, código e critério de aceite, com o laço de retorno do ciclo iterativo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f5f5"/>

  <text x="800" y="150" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="17" letter-spacing="6" fill="#4f5d75">PATHBIT AI FOR DEVS · ARTIGO 0005</text>

  <text x="800" y="280" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="88" fill="#2d3142">SDD — Spec Driven Development</text>

  <text x="800" y="345" text-anchor="middle" font-family="'Geist', sans-serif" font-size="30" fill="#4f5d75">A especificação como fonte da verdade na era dos agentes de IA</text>

  <line x1="560" y1="395" x2="1040" y2="395" stroke="rgba(45,49,66,0.18)" stroke-width="1.5"/>

  <!-- fluxo spec -> plano -> código -> critério de aceite -->
  <g font-family="'Geist', sans-serif" font-size="26" font-weight="500">
    <rect x="250" y="480" width="220" height="88" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1.5"/>
    <text x="360" y="535" text-anchor="middle" fill="#2d3142">spec</text>

    <rect x="560" y="480" width="220" height="88" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1.5"/>
    <text x="670" y="535" text-anchor="middle" fill="#2d3142">plano</text>

    <rect x="870" y="480" width="220" height="88" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1.5"/>
    <text x="980" y="535" text-anchor="middle" fill="#2d3142">código</text>

    <rect x="1180" y="480" width="240" height="88" rx="10" fill="#ffffff" stroke="#eb6c36" stroke-width="2.5"/>
    <text x="1300" y="535" text-anchor="middle" fill="#eb6c36">✓ aceite</text>
  </g>

  <line x1="470" y1="524" x2="548" y2="524" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="524" x2="858" y2="524" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="524" x2="1168" y2="524" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <!-- laço de retorno do ciclo -->
  <path d="M1300 568 L1300 640 Q1300 668 1272 668 L388 668 Q360 668 360 640 L360 578" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowAccent)"/>
  <text x="830" y="700" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="16" letter-spacing="2" fill="#eb6c36">DESVIOU? VOLTA PARA A SPEC</text>

  <text x="800" y="810" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="15" letter-spacing="4" fill="rgba(45,49,66,0.45)">ESPECIFICAR · PLANEJAR · IMPLEMENTAR · VERIFICAR</text>
</svg>
</body>
</html>
