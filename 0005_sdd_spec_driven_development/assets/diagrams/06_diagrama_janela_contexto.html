<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudo o que o agente sabe cabe nesta moldura: a janela de contexto</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="janela-contexto-title janela-contexto-desc">
      <title id="janela-contexto-title">Tudo o que o agente sabe cabe nesta moldura: a janela de contexto</title>
      <desc id="janela-contexto-desc">Um grande retângulo-moldura rotulado janela de contexto, com as fichas do que o agente vê dentro (spec do incremento, CLAUDE.md, arquivos lidos, histórico e saídas de comandos) e, fora dele, a lista do que ele não vê.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SDD · SPEC DRIVEN DEVELOPMENT · ARTIGO 0005</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">Tudo o que o agente sabe cabe nesta moldura</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== MOLDURA: JANELA DE CONTEXTO ===== -->
      <rect x="40" y="140" width="760" height="360" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
      <text x="420" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">JANELA DE CONTEXTO: ESPAÇO FINITO</text>

      <!-- Fichas dentro da moldura -->
      <rect x="70" y="200" width="330" height="62" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="235" y="238" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">spec do incremento</text>

      <rect x="440" y="200" width="330" height="62" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="605" y="238" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">CLAUDE.md</text>

      <rect x="70" y="286" width="330" height="62" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="235" y="324" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">arquivos do projeto que ele leu</text>

      <rect x="440" y="286" width="330" height="62" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="605" y="324" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">histórico da conversa</text>

      <rect x="70" y="372" width="330" height="62" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="235" y="410" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">saídas de comandos e erros</text>

      <!-- ===== FORA DA MOLDURA: O QUE ELE NÃO VÊ ===== -->
      <text x="840" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">O QUE ELE NÃO VÊ</text>

      <text x="840" y="210" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">· a reunião</text>
      <text x="840" y="244" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">· o Slack</text>
      <text x="840" y="278" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">· "todo mundo sabe que..."</text>
      <text x="840" y="312" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">· a sua intenção não escrita</text>

      <!-- Legenda -->
      <text x="600" y="560" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">o agente decide com o que está <tspan fill="#eb6c36" font-weight="600">DENTRO</tspan> da moldura: nada mais, nada menos</text>

      <!-- Rodapé -->
      <line x1="40" y1="590" x2="1160" y2="590" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0005</text>
    </svg>
  </div>
</body>
</html>
