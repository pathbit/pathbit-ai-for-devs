<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O mesmo trabalho, dois caminhos: codar no chute versus Spec Driven Development</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chute-vs-spec-title chute-vs-spec-desc">
      <title id="chute-vs-spec-title">O mesmo trabalho, dois caminhos: codar no chute versus Spec Driven Development</title>
      <desc id="chute-vs-spec-desc">Duas pistas horizontais comparando o fluxo sem spec, que termina em retrabalho, com o fluxo com spec, que termina em critério de aceite.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SDD · SPEC DRIVEN DEVELOPMENT · ARTIGO 0005</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">Do codar no chute à especificação como alvo</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== PISTA SUPERIOR: SEM SPEC ===== -->
      <text x="40" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SEM SPEC — "CODAR NO CHUTE"</text>

      <rect x="40" y="152" width="200" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="140" y="192" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">pedido vago</text>

      <line x1="240" y1="188" x2="298" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="300" y="152" width="200" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="400" y="192" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">código</text>

      <line x1="500" y1="188" x2="558" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="560" y="152" width="220" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="670" y="192" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">"não era isso"</text>

      <text x="820" y="180" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">horas gastas,</text>
      <text x="820" y="200" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">resultado incerto</text>

      <!-- Seta de retorno: retrabalho -->
      <path d="M 780,224 V 248 Q 780,256 772,256 H 48 Q 40,256 40,248 V 224" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
      <text x="410" y="248" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">retrabalho</text>

      <line x1="40" y1="292" x2="1160" y2="292" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- ===== PISTA INFERIOR: COM SPEC ===== -->
      <text x="40" y="332" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COM SPEC — SPEC DRIVEN DEVELOPMENT</text>

      <rect x="40" y="352" width="180" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="130" y="392" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">spec</text>

      <line x1="220" y1="388" x2="278" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="280" y="352" width="180" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="370" y="392" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">plano</text>

      <line x1="460" y1="388" x2="518" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="520" y="352" width="180" height="72" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="610" y="392" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">código</text>

      <line x1="700" y1="388" x2="758" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="760" y="352" width="240" height="72" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="880" y="392" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">✓ critério de aceite</text>

      <!-- Rodapé -->
      <line x1="40" y1="480" x2="1160" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="508" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">O retrabalho é o custo invisível do chute: ele não aparece no commit, aparece na agenda.</text>
      <text x="40" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0005</text>
    </svg>
  </div>
</body>
</html>
