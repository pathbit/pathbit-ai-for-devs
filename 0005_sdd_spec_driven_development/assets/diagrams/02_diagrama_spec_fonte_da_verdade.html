<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A especificação como fonte da verdade: inversão de hierarquia</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fonte-verdade-title fonte-verdade-desc">
      <title id="fonte-verdade-title">A especificação como fonte da verdade: inversão de hierarquia</title>
      <desc id="fonte-verdade-desc">Dois painéis lado a lado comparando o modelo antigo, em que o código é a única verdade e a documentação é escrita depois, com o modelo SDD, em que a spec é a única verdade e o código é um artefato derivado dela.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cabeçalho editorial -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">SDD · SPEC DRIVEN DEVELOPMENT · ARTIGO 0005</text>
      <text x="40" y="72" fill="#2d3142" font-size="26" font-family="'Instrument Serif', Georgia, serif">A especificação como fonte da verdade</text>
      <line x1="40" y1="92" x2="1160" y2="92" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== PAINEL ESQUERDO: MODELO ANTIGO ===== -->
      <text x="40" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MODELO ANTIGO</text>
      <rect x="40" y="148" width="540" height="440" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>

      <rect x="70" y="180" width="190" height="56" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="165" y="214" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">código</text>

      <line x1="260" y1="208" x2="318" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="320" y="180" width="220" height="56" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="430" y="214" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">(talvez) doc</text>

      <rect x="78" y="292" width="8" height="8" rx="1" fill="rgba(45,49,66,0.30)"/>
      <text x="96" y="300" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">o código é a única verdade</text>

      <rect x="78" y="364" width="8" height="8" rx="1" fill="rgba(45,49,66,0.30)"/>
      <text x="96" y="372" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">a doc é escrita depois, se sobrar tempo</text>

      <rect x="78" y="436" width="8" height="8" rx="1" fill="rgba(45,49,66,0.30)"/>
      <text x="96" y="444" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">divergiu? a doc está errada</text>

      <rect x="78" y="508" width="8" height="8" rx="1" fill="rgba(45,49,66,0.30)"/>
      <text x="96" y="516" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">a intenção fica na cabeça de quem escreveu</text>

      <!-- ===== PAINEL DIREITO: MODELO SDD ===== -->
      <text x="620" y="130" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MODELO SDD</text>
      <rect x="620" y="148" width="540" height="440" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>

      <rect x="650" y="180" width="150" height="56" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="725" y="214" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">spec</text>

      <line x1="800" y1="208" x2="838" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="840" y="180" width="150" height="56" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="915" y="214" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">plano</text>

      <line x1="990" y1="208" x2="1028" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="1030" y="180" width="150" height="56" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="1105" y="214" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="500" text-anchor="middle">código</text>

      <rect x="658" y="292" width="8" height="8" rx="1" fill="#eb6c36"/>
      <text x="676" y="300" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">a spec é a única verdade</text>

      <rect x="658" y="364" width="8" height="8" rx="1" fill="#eb6c36"/>
      <text x="676" y="372" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">o código é um artefato derivado dela</text>

      <rect x="658" y="436" width="8" height="8" rx="1" fill="#eb6c36"/>
      <text x="676" y="444" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">divergiu? ou o código está errado, ou a spec mudou</text>
      <text x="676" y="466" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">: decidido de forma consciente</text>

      <rect x="658" y="508" width="8" height="8" rx="1" fill="#eb6c36"/>
      <text x="676" y="516" fill="#2d3142" font-size="12.5" font-family="'Geist', sans-serif" font-weight="500">a intenção fica registrada e revisável</text>

      <!-- Rodapé -->
      <line x1="40" y1="630" x2="1160" y2="630" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="658" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">A inversão é simples de dizer e difícil de praticar: o código deixa de ser a fonte e vira a tradução.</text>
      <text x="40" y="686" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PATHBIT AI FOR DEVS · ARTIGO 0005</text>
    </svg>
  </div>
</body>
</html>
